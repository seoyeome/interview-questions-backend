spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_questions
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Gemini API 설정
gemini:
  api:
    key: ${GEMINI_API_KEY}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# OAuth2 리다이렉트 URI
app:
  oauth2:
    redirect-uri: http://localhost:3000/auth/callback

# Sentry (에러 추적)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 1.0
  enable-tracing: true

# Grafana Cloud (메트릭)
management:
  otlp:
    metrics:
      export:
        url: ${GRAFANA_OTLP_ENDPOINT:https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp/v1/metrics}
        headers:
          Authorization: Bearer ${GRAFANA_INSTANCE_ID}:${GRAFANA_API_KEY}
  metrics:
    export:
      otlp:
        enabled: true
        step: 60s