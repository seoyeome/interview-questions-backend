spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    
management:
  endpoints:
    web:
      exposure:
        include: [ "health", "info", "prometheus" ]
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        url: ${GRAFANA_OTLP_ENDPOINT:https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp/v1/metrics}
        headers:
          Authorization: Bearer ${GRAFANA_INSTANCE_ID}:${GRAFANA_API_KEY}
  metrics:
    export:
      otlp:
        enabled: true
        step: 60s

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO

# OAuth2 리다이렉트 URI
app:
  oauth2:
    redirect-uri: https://interview-questions-frontend-zeta.vercel.app/auth/callback

sentry:
  dsn: ${SENTRY_DSN}
  environment: production
  traces-sample-rate: 1.0
  enable-tracing: true

# 쿠키 설정 (프로덕션 환경)
app:
  cookie:
    secure: true  # HTTPS에서만 쿠키 전송
    same-site: "None"  # Cross-site 쿠키 허용 (OAuth 리다이렉트에 필요)
